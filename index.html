<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Bins</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #07110d;
            font-family: Arial, Helvetica, sans-serif;
        }

        .game-shell {
            position: relative;
            width: min(100vw, 1200px);
            height: min(100vh, 900px);
            margin: 0 auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #2e8b57;
        }

        .download-music {
            position: absolute;
            left: 50%;
            top: calc(50% + 105px);
            transform: translateX(-50%);
            border: 1px solid rgba(255, 255, 255, 0.42);
            border-radius: 6px;
            background: rgba(8, 20, 16, 0.82);
            color: #ffffff;
            cursor: pointer;
            font: 700 16px Arial, Helvetica, sans-serif;
            padding: 12px 18px;
            letter-spacing: 0;
        }

        .download-music:hover {
            background: rgba(21, 62, 43, 0.92);
        }

        .download-music[hidden] {
            display: none;
        }
    </style>
</head>
<body>
<div class="game-shell">
    <canvas id="game"></canvas>
    <button class="download-music" id="downloadMusic" type="button">Download Music</button>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
